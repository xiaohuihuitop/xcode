name: XCode Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'XCode release tag (for example, v1.0.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: xcode-release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  source-gate:
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.metadata.outputs.tag_name }}
      version: ${{ steps.metadata.outputs.version }}
      commit_sha: ${{ steps.metadata.outputs.commit_sha }}
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Resolve and verify XCode release metadata
        id: metadata
        shell: bash
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG_NAME="$INPUT_TAG"
          else
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          fi

          case "$TAG_NAME" in
            v*) ;;
            *)
              echo "Expected a v<version> tag, got: $TAG_NAME" >&2
              exit 1
              ;;
          esac

          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          TAG_COMMIT="$(git rev-list -n 1 "$TAG_NAME")"
          if [ -z "$TAG_COMMIT" ]; then
            echo "Unable to resolve tag commit: $TAG_NAME" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$TAG_COMMIT" origin/main; then
            echo "Tag $TAG_NAME does not belong to the main branch history" >&2
            exit 1
          fi

          VERSION="${TAG_NAME#v}"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$TAG_COMMIT" >> "$GITHUB_OUTPUT"

  backend-gate:
    needs: source-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validated tag
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.source-gate.outputs.tag_name }}
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: go version | grep -q 'go1.26.5'
      - name: Unit tests
        working-directory: backend
        run: make test-unit
      - name: Integration tests
        working-directory: backend
        shell: bash
        run: |
          set +e
          make test-integration 2>&1 | tee integration-test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            message=$(tail -n 25 integration-test.log | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error file=backend/Makefile,line=32::$message"
          fi
          exit "$status"
      - name: Upload integration test log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: backend-integration-test-log
          path: backend/integration-test.log
          if-no-files-found: error

  frontend-gate:
    needs: source-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validated tag
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.source-gate.outputs.tag_name }}
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Full frontend tests
        working-directory: frontend
        run: pnpm run test:run
      - name: Frontend typecheck
        working-directory: frontend
        run: pnpm run typecheck
      - name: Frontend lint
        working-directory: frontend
        run: pnpm run lint:check

  lint-gate:
    needs: source-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validated tag
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.source-gate.outputs.tag_name }}
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: go version | grep -q 'go1.26.5'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.9
          args: --timeout=30m --build-tags=unit --concurrency=2
          working-directory: backend

  release:
    needs:
      - source-gate
      - backend-gate
      - frontend-gate
      - lint-gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.source-gate.outputs.tag_name }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build frontend
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache-dependency-path: backend/go.sum

      - name: Build embedded server
        shell: bash
        env:
          VERSION: ${{ needs.source-gate.outputs.version }}
          COMMIT_SHA: ${{ needs.source-gate.outputs.commit_sha }}
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          mkdir -p .release/my2
          printf '%s\n' "$VERSION" > backend/cmd/server/VERSION
          go build -C backend -tags=embed -trimpath \
            -ldflags "-s -w -X main.Commit=${COMMIT_SHA} -X main.Date=$(date -u +%Y-%m-%dT%H:%M:%SZ) -X main.BuildType=xcode" \
            -o ../.release/my2/sub2api ./cmd/server

      - name: Prepare Docker build context
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .release/my2/backend/resources .release/my2/deploy
          cp Dockerfile.goreleaser .release/my2/Dockerfile
          cp -R backend/resources/. .release/my2/backend/resources/
          cp deploy/docker-entrypoint.sh .release/my2/deploy/docker-entrypoint.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build xcode latest image
        shell: bash
        env:
          VERSION: ${{ needs.source-gate.outputs.version }}
          COMMIT_SHA: ${{ needs.source-gate.outputs.commit_sha }}
        run: |
          set -euo pipefail
          docker buildx build --platform linux/amd64 --pull --load \
            --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.revision=$COMMIT_SHA" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            -f .release/my2/Dockerfile \
            -t "xcode:latest" \
            .release/my2

      - name: Create and validate offline Docker package
        shell: bash
        run: |
          set -euo pipefail
          docker save "xcode:latest" | gzip -9 > xcode_latest.tar
          test -s xcode_latest.tar
          gzip -t xcode_latest.tar
          sha256sum xcode_latest.tar > xcode_latest.tar.sha256
          sha256sum -c xcode_latest.tar.sha256
          ARCH="$(docker image inspect "xcode:latest" --format '{{.Os}}/{{.Architecture}}')"
          test "$ARCH" = "linux/amd64"

      - name: Publish XCode release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.source-gate.outputs.tag_name }}
          name: XCode ${{ needs.source-gate.outputs.version }}
          prerelease: false
          body: |
            XCode offline Docker release built from the XCode main branch.

            Offline package:
            ```bash
            docker load -i xcode_latest.tar
            # The loaded image is xcode:latest.
            ```
          files: |
            xcode_latest.tar
            xcode_latest.tar.sha256
